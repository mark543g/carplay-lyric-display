# 無 Mac 建置管線:在 GitHub 雲端 macOS runner 上編譯並打包「未簽章 IPA」。
#
# 流程:推送程式碼(或手動觸發)→ 自動產出 LyricFlow-unsigned.ipa
#      → 到 Actions 頁面下載 → 用 Windows 的 Sideloadly 以你的 Apple ID 重簽安裝。
#
# 失敗自動除錯迴環:建置失敗時,本工作流會:
#   1. 在 step 輸出顯示去重後的編譯錯誤摘要
#   2. 自動把錯誤內容發到 repo 的 GitHub Issue(標題:「🔴 Build failure auto-report」)
#      → 不用登入也能透過公開 API 讀取,方便遠端協作除錯

name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build unsigned IPA (cloud macOS)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode (needs iOS 26 SDK)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::runner 上找不到 Xcode,請改用更新的 macos runner image"
            exit 1
          fi
          echo "Using $(basename "$XCODE_PATH")"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -qi "iphoneos"; then
            echo "::error::找不到 iOS SDK"
            exit 1
          fi
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch SpotifyiOS SDK into Vendor/
        run: |
          git clone --depth 1 https://github.com/spotify/ios-sdk.git /tmp/spotify-ios-sdk
          mkdir -p Vendor
          cp -R /tmp/spotify-ios-sdk/SpotifyiOS.xcframework Vendor/
          rm -rf /tmp/spotify-ios-sdk
          echo "Vendor 內容:"
          ls -lh Vendor/

      - name: Generate Xcode project
        run: INCLUDE_SPOTIFY=true xcodegen generate

      - name: Build (Release, unsigned)
        env:
          # 免費 Apple ID 救援小工具用(repo Variable,可留空):
          # 值 = Sideloadly 實際核發的 App Group(如 group.A1B2C3D4E5.com.lab.lyricflow)
          APP_GROUP: ${{ vars.LYRICFLOW_APP_GROUP }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project LyricFlow.xcodeproj \
            -scheme LyricFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            LYRICFLOW_APP_GROUP="${APP_GROUP:-group.com.lab.lyricflow}" \
            > build.log 2>&1 || BUILD_FAILED=1

          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "================ ❌ 編譯錯誤摘要(去重)================"
            grep -E "error: " build.log | sort -u | head -n 80 || echo "(未擷取到 error: 行)"
            echo "================ 協定一致性/其他診斷 note ================"
            grep -E "note: " build.log | sort -u | head -n 40 || true
            echo "================ log 結尾 60 行 ================"
            tail -n 60 build.log
            exit 1
          fi
          echo "================ ✅ 建置成功 ================"
          tail -n 3 build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -type d -name "LyricFlow.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 LyricFlow.app"
            exit 1
          fi
          echo "App bundle: $APP"
          # 檢查 Widget 擴充功能是否已嵌入
          if [ -d "$APP/PlugIns/LyricFlowWidgets.appex" ]; then
            echo "Widget extension embedded: OK"
          else
            echo "::warning::Widget 擴充功能未嵌入,小工具/即時活動可能無法運作"
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          rm -f LyricFlow-unsigned.ipa
          # -y:保留符號連結(framework 內部結構需要)
          zip -qry LyricFlow-unsigned.ipa Payload
          echo "IPA 內容:"
          unzip -l LyricFlow-unsigned.ipa | head -n 15
          ls -lh LyricFlow-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-unsigned-ipa
          path: LyricFlow-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 建置成功後:把「IPA 解剖報告」發到 Issue,供遠端驗證
      # (確認 Spotify framework 已嵌入、dyld 相依正確)
      # ============================================================
      - name: IPA anatomy report (post to issue for remote verification)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -type d -name "LyricFlow.app" | head -n 1)
          {
            echo "IPA anatomy(commit $GITHUB_SHA)"
            echo "=== Frameworks 目錄(Spotify 是否已嵌入)==="
            ls -la "$APP/Frameworks" 2>/dev/null || echo "(無 Frameworks 目錄)"
            echo "=== 主程式 binary 連結相依(otool -L)==="
            otool -L "$APP/LyricFlow" 2>/dev/null | head -n 25
            echo "=== IPA 檔案清單(前 30 行)==="
            unzip -l LyricFlow-unsigned.ipa | head -n 30
            echo "=== Widget extension 是否嵌入 ==="
            ls "$APP/PlugIns" 2>/dev/null || echo "(無 PlugIns)"
          } > anatomy.txt
          PAYLOAD=$(jq -n --arg b "$(cat anatomy.txt)" '{body: $b}')
          EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=30" \
            | jq -r '.[] | select(.title == "Build failure auto-report") | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$EXISTING/comments" \
              -d "$PAYLOAD" > /dev/null
            echo "anatomy 報告已發到 issue #$EXISTING"
          else
            echo "(找不到既有 issue,略過發佈 —— 報告仍在 build log)"
          fi

      # ============================================================
      # 失敗時:把錯誤摘要自動發到 GitHub Issue(可匿名讀取 → 遠端除錯)
      # ============================================================
      - name: Report errors to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERROR_SUMMARY=$(grep -E "error: " build.log | sort -u | head -n 80 || echo "未擷取到 error: 行(可能失敗於更早的步驟)")
          NOTE_SUMMARY=$(grep -E "note: " build.log | sort -u | head -n 40 || true)
          if [ -n "$NOTE_SUMMARY" ]; then
            ERROR_SUMMARY=$(printf '%s\n\n[診斷 note]\n%s' "$ERROR_SUMMARY" "$NOTE_SUMMARY")
          fi
          LOG_LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf '%s\n\n%s\n%s\n%s\n\n%s %s' \
            "建置失敗(commit $GITHUB_SHA)" \
            '```' "$ERROR_SUMMARY" '```' "完整日誌:" "$LOG_LINK")
          PAYLOAD=$(jq -n --arg b "$BODY" '{body: $b}')
          TITLE="Build failure auto-report"
          EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=30" \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "在既有 issue #$EXISTING 追加留言"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$EXISTING/comments" \
              -d "$PAYLOAD" > /dev/null
          else
            echo "建立新 issue"
            ISSUE_PAYLOAD=$(jq -n --arg t "$TITLE" --arg b "$BODY" '{title: $t, body: $b}')
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
              -d "$ISSUE_PAYLOAD" > /dev/null
          fi
