# 無 Mac 建置管線:在 GitHub 雲端 macOS runner 上編譯並打包「未簽章 IPA」。
#
# 流程:推送程式碼(或手動觸發)→ 自動產出 LyricFlow-unsigned.ipa
#      → 到 Actions 頁面下載 → 用 Windows 的 Sideloadly 以你的 Apple ID 重簽安裝。
#
# 注意:
# - 未簽章 IPA 無法直接安裝,必須先經 Sideloadly(Windows 可用)重簽
# - 免費 Apple ID:7 天效期、最多 3 個 App;付費開發者帳號:1 年效期
# - 詳細說明見 README.md「沒有 Mac?雲端建置直接拿 IPA」一節

name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (cloud macOS)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (needs iOS 26 SDK)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::runner 上找不到 Xcode,請改用更新的 macos runner image"
            exit 1
          fi
          echo "Using $(basename "$XCODE_PATH")"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -qi "iphoneos"; then
            echo "::error::找不到 iOS SDK"
            exit 1
          fi
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch SpotifyiOS SDK into Vendor/
        run: |
          git clone --depth 1 https://github.com/spotify/ios-sdk.git /tmp/spotify-ios-sdk
          mkdir -p Vendor
          cp -R /tmp/spotify-ios-sdk/SpotifyiOS.xcframework Vendor/
          rm -rf /tmp/spotify-ios-sdk
          echo "Vendor 內容:"
          ls -lh Vendor/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        env:
          # 免費 Apple ID 救援小工具用:
          # 1. 先用 Sideloadly 簽一次,在其 App Groups 欄位找到實際核發的 group
          #    (格式如 group.A1B2C3D4E5.com.lab.lyricflow,免費帳號會強制加 team ID 前綴)
          # 2. 到 repo → Settings → Secrets and variables → Actions → Variables
          #    新增 LYRICFLOW_APP_GROUP = 該 group 完整 ID
          # 3. 重新觸發本工作流 → 小工具/CarPlay 小工具即可讀到歌詞資料
          APP_GROUP: ${{ vars.LYRICFLOW_APP_GROUP }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project LyricFlow.xcodeproj \
            -scheme LyricFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            LYRICFLOW_APP_GROUP="${APP_GROUP:-group.com.lab.lyricflow}" \
            2>&1 | tail -n 80

      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -type d -name "LyricFlow.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 LyricFlow.app"
            exit 1
          fi
          echo "App bundle: $APP"
          # 檢查 Widget 擴充功能是否已嵌入
          if [ -d "$APP/PlugIns/LyricFlowWidgets.appex" ]; then
            echo "Widget extension embedded: OK"
          else
            echo "::warning::Widget 擴充功能未嵌入,小工具/即時活動可能無法運作"
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          rm -f LyricFlow-unsigned.ipa
          # -y:保留符號連結(framework 內部結構需要)
          zip -qry LyricFlow-unsigned.ipa Payload
          echo "IPA 內容:"
          unzip -l LyricFlow-unsigned.ipa | head -n 15
          ls -lh LyricFlow-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-unsigned-ipa
          path: LyricFlow-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
