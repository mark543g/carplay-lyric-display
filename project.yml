# XcodeGen 專案定義 —— 在 Mac 上執行 `xcodegen generate` 產生 LyricFlow.xcodeproj
# https://github.com/yonaskolb/XcodeGen
name: LyricFlow

# Spotify SDK 以「顯式 framework 依賴」連結+嵌入(CI 設 INCLUDE_SPOTIFY=true 啟用;
# 未設時此 include 跳過,專案不引用 Vendor,照樣可建置)。
# ⚠️ 不可把 Vendor 放進 sources:那只會連結不會嵌入,導致裝置上 dyld 閃退。
include:
  - path: project.spotify.yml
    enable: ${INCLUDE_SPOTIFY}

options:
  bundleIdPrefix: com.lab
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # 行銷版號:手動維護(有意義的釋出才改,如 1.0 → 1.1)
    MARKETING_VERSION: "1.0"
    # 建置號:CI 會以 github.run_number 覆寫(單調遞增);本機建置維持 1
    CURRENT_PROJECT_VERSION: "1"
    # 版本顯示用(CI 注入 short SHA 與建置日期;本機留空 → App 內自動省略)
    LYRICFLOW_GIT_SHA: ""
    LYRICFLOW_BUILD_DATE: ""
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    # App Group 預設值:免費 Apple ID + Sideloadly 簽章時,
    # 由 CI 以建置參數覆寫(見 .github/workflows/build-ipa.yml 與 README)
    LYRICFLOW_APP_GROUP: group.com.lab.lyricflow

targets:
  LyricFlow:
    type: application
    platform: iOS
    sources:
      - path: LyricFlow
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.lyricflow
        PRODUCT_NAME: LyricFlow
        INFOPLIST_FILE: LyricFlow/Info.plist
        CODE_SIGN_ENTITLEMENTS: LyricFlow/LyricFlow.entitlements
        # App 圖示(LyricFlow/Assets.xcassets/AppIcon.appiconset,源自根目錄 icon.png)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LyricFlowWidgets

  LyricFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricFlowWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.lyricflow.widgets
        PRODUCT_NAME: LyricFlowWidgets
        INFOPLIST_FILE: LyricFlowWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LyricFlowWidgets/LyricFlowWidgets.entitlements
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  LyricFlow:
    build:
      targets:
        LyricFlow: all
    run:
      config: Debug
    archive:
      config: Release
